[workspace]
resolver = "2"
members = [
    "crates/dsl-core",
    "crates/dsl-autocomplete",
    "crates/dsl-tui",
    "crates/dsl-repl",
    "tree-sitter-dsl", "crates/dsl-ir", "crates/dsl-interpreter", "crates/dsl-codegen", "crates/dsl-compiler",
]

[workspace.dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parser
pest = "2.7"
pest_derive = "2.7"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-language = "0.1"

# Database (for later phases)
duckdb = { version = "1.4.1"}

# HTTP client (for later phases)
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = true }

# CSV (for later phases)
csv = "1.3"

# Configuration (for later phases)
toml = "0.8"
