[workspace]
resolver = "2"
members = [
    "crates/dsl-repl",
]

[workspace.dependencies]
# TUI
ratatui = "0.27"
crossterm = "0.27"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.0", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parser
pest = "2.7"
pest_derive = "2.7"

# Database (for later phases)
duckdb = { version = "1.4.1"}

# HTTP client (for later phases)
reqwest = { version = "0.12", features = ["json"] }

# CSV (for later phases)
csv = "1.3"

# Configuration (for later phases)
toml = "0.8"
