[package]
name = "dsl-interpreter-neon"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Exclude from parent workspace
[workspace]

[lib]
name = "index"
crate-type = ["cdylib"]

[dependencies]
neon = { version = "1.0", default-features = false, features = ["napi-6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"

[dependencies.tokio]
version = "1.0"
features = ["rt", "rt-multi-thread", "macros"]

[dependencies.dsl-interpreter]
path = "../../../../crates/dsl-interpreter"

[dependencies.dsl-ir]
path = "../../../../crates/dsl-ir"

[profile.release]
lto = true
opt-level = 3
