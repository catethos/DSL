[package]
name = "dsl-tui"
version = "1.0.0"
edition = "2021"

[dependencies]
# Core DSL engine
dsl-core = { path = "../dsl-core" }

# IR layer
dsl-ir = { path = "../dsl-ir" }

# IR interpreter
dsl-interpreter = { path = "../dsl-interpreter" }

# Autocomplete engine
dsl-autocomplete = { path = "../dsl-autocomplete" }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# Text editor widget
tui-textarea = "0.6.1"

# Syntax highlighting
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-language = { workspace = true }
tree-sitter-dsl = { path = "../../tree-sitter-dsl" }

# Async runtime
tokio = { workspace = true }

# Clipboard support
arboard = "3.4"

# Unicode width calculation for proper cursor positioning with wide characters
unicode-width = "0.1"

# Markdown rendering
pulldown-cmark = "0.13"

# Serialization for save/load commands
serde = { workspace = true }
serde_json = { workspace = true }

# IndexMap for ordered maps
indexmap = { workspace = true }

# Image rendering in TUI
ratatui-image = { workspace = true }
image = { workspace = true }
