[package]
name = "dsl-repl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dsl"
path = "src/main.rs"

[dependencies]
# Core DSL engine and TUI
dsl-core = { path = "../dsl-core" }
dsl-tui = { path = "../dsl-tui" }

# Async runtime
tokio = { workspace = true }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
