[package]
name = "dsl-repl"
version = "2.5.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "dsl"
path = "src/main.rs"

[dependencies]
# Core DSL engine and TUI
dsl-core = { path = "../dsl-core" }
dsl-ir = { path = "../dsl-ir" }
dsl-interpreter = { path = "../dsl-interpreter" }
dsl-tui = { path = "../dsl-tui" }

# Async runtime
tokio = { workspace = true }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Self-update support
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.8"
