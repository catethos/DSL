[package]
name = "lattice-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lat"
path = "src/main.rs"

[dependencies]
# Core lattice library
lattice = { path = "../lattice" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Interactive REPL
rustyline = { version = "14", features = ["derive"] }

# Directory paths (for history file)
dirs = "5"

# Error handling
anyhow = "1"

# JSON output
serde_json = "1"
