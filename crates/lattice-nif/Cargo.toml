[package]
name = "lattice-nif"
version.workspace = true
edition.workspace = true
description = "Rustler NIF bindings for embedding Lattice in Elixir"

[lib]
name = "lattice_nif"
crate-type = ["cdylib"]
# Disable test compilation - NIF crates can only be tested through Elixir/Mix
# because they require the Erlang runtime for linking (_enif_* symbols)
test = false
doctest = false
bench = false

[dependencies]
lattice = { path = "../lattice", default-features = false }
rustler = "0.34"

[features]
default = []
sql = ["lattice/sql"]
