[package]
name = "dsl-egui"
version = "2.0.0"
edition = "2021"

[lib]
name = "dsl_egui"
path = "src/lib.rs"

[[bin]]
name = "dsl-gui"
path = "src/main.rs"

[dependencies]
# egui framework
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect", "image"] }
egui_plot = "0.29"

# Core DSL engine
dsl-core = { path = "../dsl-core" }
dsl-ir = { path = "../dsl-ir" }
dsl-interpreter = { path = "../dsl-interpreter" }
dsl-autocomplete = { path = "../dsl-autocomplete" }

# Tree-sitter syntax highlighting
tree-sitter = { workspace = true }
tree-sitter-highlight = { workspace = true }
tree-sitter-language = { workspace = true }
tree-sitter-dsl = { path = "../../tree-sitter-dsl" }

# Async runtime
tokio = { workspace = true }

# Clipboard support
arboard = "3.4"

# File picker dialogs
rfd = "0.15"

# Unicode width calculation
unicode-width = "0.1"

# Markdown rendering
pulldown-cmark = "0.13"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# IndexMap for ordered maps
indexmap = { workspace = true }

# Image loading
image = { workspace = true }
